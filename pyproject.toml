# add.py is one file on purpose: a student downloads it, drops it next to
# their own script and writes `import add`.  That stays the recommended way.
#
# The metadata below makes an *optional* package out of the same file, so
# that `pip install add3d` also works (the name `add` is taken on PyPI by an
# empty placeholder -- see PUBLISHING.md).  Installing it puts one module,
# `add`, into site-packages; nothing else.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "add3d"
version = "2.0"
description = "Build 3D models with nothing but Python code: one file, no dependencies, mesh booleans and subdivision surfaces from scratch."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Martynas Sabaliauskas", email = "martynas.sabaliauskas@mif.vu.lt"}]
keywords = ["3d", "geometry", "mesh", "csg", "parametric-surfaces", "subdivision-surfaces", "catmull-clark", "education", "off", "obj", "sketchfab"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/martynas-sabaliauskas/add3d"
Documentation = "https://martynas-sabaliauskas.github.io/add3d/"

[tool.setuptools]
py-modules = ["add"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 80
target-version = "py38"
exclude = ["tests/legacy", "examples/out", "examples/add.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E741",   # `l` is a perfectly good index name in geometry code
    "UP031",  # %-formatting is used throughout, on purpose: it works everywhere
]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
"tests/*.py" = ["E402"]
