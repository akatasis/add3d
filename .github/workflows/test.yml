name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: add.py and examples/add.py are in sync with _src/
        run: python build.py --check

      - name: unit tests
        run: python tests/test_add.py

      - name: add.py 1.2 models still build
        run: python tests/test_legacy.py

      - name: every documentation example runs
        run: python tests/test_docs.py

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: every example runs and fits the Sketchfab limits
        run: python examples/build_all.py --models

      - name: every public function is used by at least one example
        run: python tools/coverage.py --strict

      - name: documentation is in sync with the docstrings
        run: |
          python tools/make_docs.py
          git diff --exit-code docs/index.html

  cpp:
    # add.hpp, the C++ twin: the same calls must write the same files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: add.hpp and examples/add.hpp are in sync with _cpp/
        run: python build.py --check

      - name: every function writes the same files in C++ as in Python
        run: python tests/cpp/run_parity.py

      - name: every documentation example builds the same model in C++
        run: python tests/cpp/run_docs.py

      - name: examples/46_castle.cpp is examples/46_castle.py translated
        run: python tools/py2cpp/py2cpp.py --check

      - name: every example program writes the same files in C++ (the castle as its quick run)
        run: python examples/build_all.py --cpp
